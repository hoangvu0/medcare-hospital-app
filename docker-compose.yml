services:
  medcare-api:
    build:
      context: ./server
    environment:
      MEDCARE_HOST: 0.0.0.0
      MEDCARE_PORT: 8080
      MEDCARE_DB_PATH: /data/medcare_server.sqlite
      MEDCARE_JWT_SECRET: ${MEDCARE_JWT_SECRET:-change-this-long-random-secret}
    volumes:
      - medcare_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - medcare-api
    environment:
      MEDCARE_DOMAIN: ${MEDCARE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  medcare_data:
  caddy_data:
  caddy_config:
